name: CompanyFlow CMS preview checks

on:
  push:
    branches:
      - feature/companyflow-admin-panel
    paths:
      - 'admin/**'
      - 'supabase/**'
      - 'tools/**'
      - '.github/workflows/cms-preview-checks.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'admin/**'
      - 'supabase/**'
      - 'tools/**'
      - '.github/workflows/cms-preview-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-cms:
    name: Validate isolated CMS branch
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate solutions generator syntax
        run: python -m py_compile tools/data.py tools/build_solutions.py

      - name: Check required CMS and visual editor files
        run: |
          test -f admin/index.html
          test -f admin/admin.js
          test -f admin/admin.css
          test -f admin/builder.html
          test -f admin/builder.js
          test -f admin/builder.css
          test -f admin/import-pages.html
          test -f admin/import-pages.js
          test -f admin/import-pages.css
          test -f admin/README.md
          echo "Required CMS and visual editor files exist."

      - name: Validate browser JavaScript syntax
        run: |
          node --input-type=module --check < admin/admin.js
          node --input-type=module --check < admin/builder.js
          node --input-type=module --check < admin/import-pages.js
          echo "Browser JavaScript syntax is valid."

      - name: Validate local admin asset references
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import sys

          pages = [Path("admin/index.html"), Path("admin/builder.html"), Path("admin/import-pages.html")]
          root = Path("admin").resolve()
          missing = []

          class AssetParser(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  key = "src" if tag == "script" else "href" if tag == "link" else None
                  value = attrs.get(key) if key else None
                  if not value or value.startswith(("http://", "https://", "//", "#", "data:")):
                      return
                  target = (root / value).resolve()
                  if not target.is_relative_to(root) or not target.is_file():
                      missing.append(value)

          for page in pages:
              parser = AssetParser()
              parser.feed(page.read_text(encoding="utf-8"))
          if missing:
              print("Missing or invalid local asset references:", ", ".join(missing))
              sys.exit(1)
          print("Local admin asset references look valid.")
          PY

      - name: Check browser code for obvious privileged key patterns
        run: |
          if grep -RniE 'sb_secret_[A-Za-z0-9_-]{12,}|service_role_[A-Za-z0-9_-]{12,}' admin; then
            echo "Potential privileged Supabase key found in browser-facing admin files."
            exit 1
          fi
          echo "No obvious privileged Supabase key patterns found."

      - name: Confirm validation-only workflow
        run: echo "Validation only. This workflow does not deploy or publish the website."

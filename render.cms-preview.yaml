# Optional standalone Render preview for the CompanyFlow CMS admin only.
# Create this as a NEW Render Blueprint/service. Do not attach it to the production service.
services:
  - type: web
    runtime: static
    name: companyflow-cms-preview
    branch: feature/companyflow-admin-panel
    buildCommand: echo "CompanyFlow CMS preview - static assets only"
    staticPublishPath: admin
    autoDeploy: false
